<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before the browser paints or loads the app.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('novasync-theme') === 'light' ? 'light' : 'dark';
      } catch {
        // Keep the default dark theme when storage is unavailable.
      }
    </script>
    <style>
      :root { color-scheme: dark; background: #202b32; }
      :root[data-theme="light"] { color-scheme: light; background: #eeeded; }
      body { margin: 0; background: inherit; }
      body, #root { min-height: 100svh; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=novasync-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaSync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
