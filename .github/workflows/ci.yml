name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Keep this version aligned with local development and Render.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: node --test src/pages/dashboardData.test.js src/utils/moveBoardTask.test.js src/utils/taskTools.test.js

      - name: Install backend for production serving test
        run: npm ci --prefix backend --omit=dev

      - name: Test production homepage and API routing without Atlas
        run: node --test backend/config/frontend.test.js

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # Syntax checks do not connect to Atlas or modify application data.
      - name: Check backend JavaScript
        run: find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -r -n 1 node --check
