# Import through Render > New > Blueprint, or use DEPLOYMENT.md for existing services.
services:
  - type: web
    name: novasync-backend
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SOCKET_IO_CORS
        sync: false

  - type: web
    name: novasync-frontend
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Public backend URL ending in /api, not the Atlas URI.
      - key: VITE_API_URL
        sync: false
      # Public backend origin without /api.
      - key: VITE_SOCKET_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
