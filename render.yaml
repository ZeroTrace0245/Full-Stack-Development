# One free service serves the website, API, and Socket.IO.
services:
  - type: web
    name: novasync-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm ci --prefix backend --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: VITE_SOCKET_URL
        value: /
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
